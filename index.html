<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thesis Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--side:#0b1f3a;--side2:#12305a;--pill:#bfeee8;--pilltx:#0b1f3a;--bg:#e8f1f7;--card:#fff;--hero:#c9ecee;--ink:#14263d;--mute:#5b6f85;--line:#d3e0ea;--btn:#1d72c8;--ok:#1f9d74;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1824;--card:#16253a;--hero:#17414b;--ink:#e6eef7;--mute:#94a8bd;--line:#26384f;--pill:#9fe3da}}
:root[data-theme="dark"]{--bg:#0e1824;--card:#16253a;--hero:#17414b;--ink:#e6eef7;--mute:#94a8bd;--line:#26384f;--pill:#9fe3da}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;height:100%}
aside{width:250px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#e7f0fb;display:flex;flex-direction:column;padding:16px 14px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}
.logo{width:38px;height:38px;border-radius:10px;background:#1c3d6b;display:grid;place-items:center;font-size:18px}
.brand b{font-family:"Space Mono",monospace;font-size:14px;letter-spacing:.06em;display:block}
.brand small{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.08em;opacity:.8}
.team{padding:10px 6px 16px;border-bottom:1px solid #ffffff1f;margin-bottom:14px}
.team b{display:block;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.05em}
.team span{font-size:11px;opacity:.7}
.ws{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;opacity:.55;padding:0 8px 8px}
nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:3px;color:#d5e3f3}
nav button:hover{background:#ffffff14}
nav button[aria-current=page]{background:var(--pillbg,#bfeee8);color:var(--pilltx);font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5fb4ff;outline-offset:2px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid #ffffff1f}
.av{width:32px;height:32px;border-radius:50%;background:#2a5fa3;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.me b{font-size:12px;display:block}.me small{opacity:.65;font-size:11px}
main{flex:1;min-width:0;overflow:auto}
.top{display:flex;align-items:center;gap:6px;padding:12px 24px;background:color-mix(in srgb,var(--card) 70%,transparent);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.crumb{color:var(--mute);font-size:12px;margin-right:auto}
.tb{all:unset;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:12px;color:var(--ink)}
.tb:hover{background:var(--line)}.tb:focus-visible{outline:2px solid #5fb4ff}
.page{padding:24px;max-width:1000px}
.hero{background:var(--hero);border-radius:16px;padding:32px;margin-bottom:18px}
.eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;margin:0 0 14px}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 10px;max-width:14ch;letter-spacing:-.01em}
.hero p{color:var(--mute);margin:0 0 20px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--btn);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;font-size:12px}
.btn:hover{filter:brightness(1.1)}
.link{font-size:12px;color:var(--ink);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 12px;font-size:14px}
.stat{font-size:30px;font-weight:700;margin:4px 0 0}.lab{color:var(--mute);font-size:12px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok)}
.done span.t{text-decoration:line-through;color:var(--mute)}
.t{flex:1}.tag{font-size:11px;color:var(--mute)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input[type=text],input[type=number],input[type=date],select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
input[type=text]{flex:1;min-width:160px}
h2{margin:0 0 16px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.ok{background:#1f9d7422;color:var(--ok);border-color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px;font-size:11px;overflow:hidden}
.cal .h{min-height:0;background:none;border:0;color:var(--mute);text-align:center}
.cal .today{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn)}
.ev{display:block;background:var(--pill);color:#0b1f3a;border-radius:4px;padding:1px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){
.app{flex-direction:column}
aside{width:100%;flex-direction:row;padding:8px;overflow-x:auto;gap:6px;align-items:center}
.brand,.team,.ws,.me{display:none}
aside nav{display:flex;gap:4px}nav button{white-space:nowrap;width:auto;margin:0}
.page{padding:14px}.hero{padding:22px}.hero h1{font-size:26px}.top{padding:8px 14px}
.cal div{min-height:52px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">✦</div><div><b>THESIS</b><small>COMMAND CENTER</small></div></div>
  <div class="team"><b>SAMPLE THESIS TITLE</b><span>Pampanga State University</span></div>
  <div class="ws">WORKSPACE</div>
  <nav id="nav" aria-label="Workspace"></nav>
  <div class="me"><div class="av">S</div><div><b>Sample</b><small>Sample</small></div></div>
</aside>
<main>
  <div class="top">
    <span class="crumb" id="crumb">Home / dashboard</span>
  </div>
  <div class="page" id="view"></div>
</main>
</div>
<script>
var NAV=[["today","Today & my dashboard","🏠"],["overview","Overview","▦"],["tasks","Tasks","✔"],["team","Team","👥"],["calendar","Calendar","📅"],["finances","Finances",""],["announcements","Announcements","📢"]];
var txs=[{amt:0,date:"2026-10-01",use:"Sample"}];
var pays=[{who:"Sample",amt:0,date:"2026-10-01"}];
var fmt=function(n){return n.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})};
var members=[["Sample","Sample"]];
var tasks=[{t:"Sample",who:"Sample",d:0,done:false,day:1}];
var notes=[{t:"Sample",b:"Sample",a:"Sample"}];
var cur="overview",TODAY=1;
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var $=function(i){return document.getElementById(i)};
function pct(){var n=tasks.filter(function(x){return x.done}).length;return tasks.length?Math.round(n/tasks.length*100):0}
function taskList(list){return list.length?list.map(function(x){var i=tasks.indexOf(x);return '<label class="item'+(x.done?' done':'')+'"><input type="checkbox" data-i="'+i+'"'+(x.done?' checked':'')+'><span class="t">'+esc(x.t)+'</span><span class="tag">'+esc(x.who)+'</span></label>'}).join(""):'<p class="lab">Nothing here yet. Add a task to get started.</p>'}
var V={
overview:function(){var open=tasks.filter(function(x){return!x.done});return '<section class="hero" style="padding:20px"><button class="btn" data-go="tasks">+ Assign a task</button></section><div class="grid"><div class="card"><div class="lab">Progress</div><div class="stat">'+pct()+'%</div><div class="bar"><i style="width:'+pct()+'%"></i></div></div><div class="card"><div class="lab">Open tasks</div><div class="stat">'+open.length+'</div></div><div class="card"><div class="lab">Team members</div><div class="stat">'+members.length+'</div></div></div><div class="card"><h3>Up next</h3>'+taskList(open.slice(0,3))+'</div>'},
today:function(){var d=tasks.filter(function(x){return x.day===TODAY});return '<h2>Today & my dashboard</h2><div class="grid"><div class="card"><div class="lab">Due today</div><div class="stat">'+d.filter(function(x){return!x.done}).length+'</div></div><div class="card"><div class="lab">Done overall</div><div class="stat">'+tasks.filter(function(x){return x.done}).length+'</div></div></div><div class="card"><h3>Today\'s tasks</h3>'+taskList(d)+'</div>'},
tasks:function(){return '<h2>Tasks</h2><div class="add"><input type="text" id="nt" placeholder="What needs to be done?" aria-label="Task name"><select id="nw" aria-label="Assign to">'+members.map(function(m){return '<option>'+m[0]+'</option>'}).join("")+'</select><button class="btn" id="addt">Assign task</button></div><div class="card">'+taskList(tasks)+'</div>'},
team:function(){return '<h2>Team</h2><div class="grid">'+members.map(function(m){var n=tasks.filter(function(x){return x.who===m[0]&&!x.done}).length;return '<div class="card"><div class="av" style="background:var(--btn);color:#fff;margin-bottom:10px">'+m[0].split(" ").map(function(p){return p[0]}).join("")+'</div><b>'+m[0]+'</b><div class="lab">'+m[1]+'</div><div class="lab" style="margin-top:8px">'+n+' open task'+(n===1?'':'s')+'</div></div>'}).join("")+'</div>'},
calendar:function(){var h="<h2>October 2026</h2><div class='cal'>"+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(d){return "<div class='h'>"+d+"</div>"}).join("");for(var i=0;i<4;i++)h+="<div style='opacity:.3'></div>";for(var d=1;d<=31;d++){var ev=tasks.filter(function(x){return x.day===d}).map(function(x){return '<span class="ev">'+esc(x.t)+'</span>'}).join("");h+='<div'+(d===TODAY?' class="today"':'')+'><b>'+d+'</b>'+ev+'</div>'}return h+"</div>"},
finances:function(){var tot=txs.reduce(function(s,x){return s+x.amt},0);var col=pays.reduce(function(s,x){return s+x.amt},0),hand=col-tot,today=new Date().toISOString().slice(0,10);var who={};members.forEach(function(m){who[m[0]]=0});pays.forEach(function(p){who[p.who]=(who[p.who]||0)+p.amt});var chips=Object.keys(who).map(function(n){var ok=who[n]>0;return '<span class="chip '+(ok?'ok':'no')+'">'+esc(n)+' · '+(ok?'Paid ₱'+fmt(who[n]):'Not yet paid')+'</span>'}).join("");var prow=pays.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(x){var i=pays.indexOf(x);return '<div class="item"><span class="tag" style="width:90px">'+esc(x.date)+'</span><span class="t">'+esc(x.who)+'</span><b>₱'+fmt(x.amt)+'</b><button class="link" data-delp="'+i+'">Remove</button></div>'}).join("");var rows=txs.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(x){var i=txs.indexOf(x);return '<div class="item"><span class="tag" style="width:90px">'+esc(x.date)+'</span><span class="t">'+esc(x.use)+'</span><b>₱'+fmt(x.amt)+'</b><button class="link" data-del="'+i+'">Remove</button></div>'}).join("");return '<h2>Finances</h2><div class="grid"><div class="card"><div class="lab">Money on hand</div><div class="stat" style="color:'+(hand<0?'#d64545':'var(--ok)')+'">₱'+fmt(hand)+'</div></div><div class="card"><div class="lab">Total collected</div><div class="stat">₱'+fmt(col)+'</div></div><div class="card"><div class="lab">Total spent</div><div class="stat">₱'+fmt(tot)+'</div></div></div><div class="card" style="margin-bottom:18px"><h3>Team payments</h3><div class="chips">'+chips+'</div><div class="add"><input type="text" id="pw" list="mem" placeholder="Who paid?" aria-label="Member name"><datalist id="mem">'+members.map(function(m){return '<option value="'+esc(m[0])+'">'}).join("")+'</datalist><input type="number" id="pa" min="0" step="0.01" placeholder="Amount (₱)" aria-label="Amount paid"><input type="date" id="pd" value="'+today+'" aria-label="Date paid"><button class="btn" id="addp">Record payment</button></div>'+prow+'</div><h3 style="margin:0 0 10px">Add expense</h3><div class="add"><input type="number" id="fa" min="0" step="0.01" placeholder="Amount (₱)" aria-label="Amount"><input type="date" id="fd" value="'+new Date().toISOString().slice(0,10)+'" aria-label="Date"><input type="text" id="fu" placeholder="What was it used for?" aria-label="Purpose"><button class="btn" id="addf">Add transaction</button></div><div class="card"><h3>Financial history</h3>'+(rows||'<p class="lab">No transactions yet.</p>')+'</div>'},
announcements:function(){return '<h2>Announcements</h2><div class="add"><input type="text" id="an" placeholder="Share an update with the team" aria-label="Announcement"><button class="btn" id="posta">Post update</button></div>'+notes.map(function(n){return '<div class="card" style="margin-bottom:12px"><h3>'+esc(n.t)+'</h3><div>'+esc(n.b)+'</div><div class="lab" style="margin-top:8px">Posted by '+esc(n.a)+'</div></div>'}).join("")}
};
function render(){
  $("nav").innerHTML=NAV.map(function(n){return '<button data-go="'+n[0]+'"'+(n[0]===cur?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join("");
  $("view").innerHTML=V[cur]();
  $("crumb").textContent="Home / "+(cur==="overview"?"dashboard":cur);
}
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");if(g){cur=g.getAttribute("data-go");render();return}
  if(e.target.id==="addt"){var v=$("nt").value.trim();if(v){tasks.unshift({t:v,who:$("nw").value,d:0,done:false,day:TODAY});render()}}
  if(e.target.id==="addf"){var m=parseFloat($("fa").value),dt=$("fd").value,u=$("fu").value.trim();if(!isNaN(m)&&m>=0&&dt&&u){txs.push({amt:m,date:dt,use:u});render()}}
  var dl=e.target.getAttribute&&e.target.getAttribute("data-del");if(dl!==null&&dl!==undefined){txs.splice(+dl,1);render()}
  if(e.target.id==="addp"){var pm=parseFloat($("pa").value),pdt=$("pd").value,pwho=$("pw").value.trim();if(!isNaN(pm)&&pm>=0&&pdt&&pwho){pays.push({who:pwho,amt:pm,date:pdt});render()}}
  var dp=e.target.getAttribute&&e.target.getAttribute("data-delp");if(dp!==null&&dp!==undefined){pays.splice(+dp,1);render()}
  if(e.target.id==="posta"){var a=$("an").value.trim();if(a){notes.unshift({t:a,b:"",a:"Masaki"});render()}}
});
document.addEventListener("change",function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i!==null&&i!==undefined){tasks[+i].done=e.target.checked;render()}});
render();
</script>
</body>
</html>
